version: 2

updates:
  # The npm ecosystem covers pnpm workspaces: Dependabot reads pnpm-lock.yaml and
  # the workspace manifests under apps/* and packages/*.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Dependabot's default subject ("Bump x from a to b") is not a Conventional
    # Commit, which .claude/skills/commit/SKILL.md requires. This yields
    # `chore(deps): ...` / `chore(deps-dev): ...` instead.
    commit-message:
      prefix: chore
      include: scope
    # pnpm 11 enforces a minimum release age (the auto-written
    # minimumReleaseAgeExclude block in pnpm-workspace.yaml is the evidence).
    # Without a matching cooldown, Dependabot can propose a version too young for
    # pnpm to resolve, and the lockfile update fails.
    cooldown:
      default-days: 7
    # Ungrouped, a tree this size opens enough weekly pull requests that people stop
    # reading them — which is worse than not updating at all.
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # ts-jest declares `typescript: ">=4.3 <7"`, so TypeScript 7 is excluded by the
      # backend test toolchain. Unpin only once ts-jest supports it.
      - dependency-name: typescript
        versions: [">=7"]
      # Tracks the Node 24 runtime pinned in .nvmrc, not the newest release line.
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
