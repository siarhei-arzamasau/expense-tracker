services:
  postgres:
    image: postgres:17-alpine
    container_name: expense-tracker-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense}
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense} -d ${POSTGRES_DB:-expense_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dbhub:
    image: bytebase/dbhub:latest
    ports:
      - "8080:8080"
    command:
      - --transport
      - http
      - --port
      - "8080"
      - --dsn
      - "postgres://${POSTGRES_USER:-expense}:${POSTGRES_PASSWORD:-expense}@postgres:5432/${POSTGRES_DB:-expense_tracker}?sslmode=disable"
    depends_on:
      - postgres

volumes:
  postgres-data:
